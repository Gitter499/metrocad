name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @metrocad/core
      - run: npm run build -w @metrocad/web
      - run: touch apps/web/dist/.nojekyll
      # Publishes to the gh-pages branch; GitHub serves it at https://<owner>.github.io/metrocad/
      # (Settings → Pages → Source: "Deploy from a branch" → gh-pages / root, enabled automatically
      # for public repos when the branch appears).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          force_orphan: true
