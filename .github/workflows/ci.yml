name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @metrocad/core
      - run: npm run build -w @metrocad/cli
      - run: npm test
      - run: node packages/cli/bin/metrocad.js --fixture paris --width 600 --labels major --no-parts --no-ar --out /tmp/paris
