name: Verify networks against Wikidata and official maps
on:
  push:
    paths: ['packages/core/fixtures/**', 'packages/core/official-sources.json', 'packages/core/src/verify.ts', 'packages/core/src/network.ts', 'packages/core/src/svgimport.ts', 'packages/core/src/official/**', 'scripts/verify-web.mjs', 'scripts/verify-official.mjs', 'scripts/official-*.mjs', '.github/workflows/verify.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @metrocad/core
      - run: node scripts/verify.mjs paris && node scripts/verify.mjs london
      - run: node scripts/verify-web.mjs || echo "::warning::some lines differ from Wikipedia/Wikidata — see docs/verification.md"
      # Official-map comparison: fetch the operator's current diagram, extract its geometry, place our stations on it,
      # and report every station that is missing, off its line, or out of place, with a side-by-side image.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pymupdf pillow
      - run: npx playwright install --with-deps chromium
      - name: Candidate Commons diagrams for cities without a pinned map
        run: node scripts/official-discover.mjs
      - name: Every city vs its official / reference map
        run: |
          for city in $(node -e "console.log(Object.keys(require('./packages/core/official-sources.json')).join(' '))"); do
            node scripts/official-sync.mjs "$city" || echo "::warning::$city differs from its official map — see docs/verification-$city.md"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-maps
          path: tmp/official/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            docs/verification*.md
            docs/screenshots/verify-*.png
      - name: Commit report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "metrocad-verify[bot]"
          git config user.email "verify@metrocad.local"
          git add docs/verification*.md docs/screenshots/verify-*.png packages/core/fixtures/*.official.json
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh Wikidata verification report"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
